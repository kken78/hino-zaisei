# 材料の検算と data.js の再生成の確認。
# プルリクエストと main への push のたびに、inputs.lock.json の commit の材料で
# tools/build_data.py を実行し、作り直した data.js がコミットされたものと一致するかを確かめる。
# 材料は shiga-hino-plans・hino-ronten・hino-town-docs の3リポジトリ。
# hino-town-docs からは、台帳 data/sources.tsv と構造化の層 data/struct/（補正予算・決算・財政指標。DESIGN.md ADR-4）を読む。
# CI はリポジトリごとに commit を1つだけ取り出すので、lock の同じリポジトリのファイルは同じ commit にそろえる。
# あわせて、hino-portal の shared/ の検査（共通の部品、文字の大きさ、幅 360px と 1024px での実寸）を走らせる。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 材料のリポジトリを隣のフォルダに置くため、このリポジトリも1段下に置く
      - uses: actions/checkout@v7
        with:
          path: hino-zaisei

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: inputs.lock.json から材料の commit を読む
        id: lock
        working-directory: hino-zaisei
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          lock = json.load(open('inputs.lock.json', encoding='utf-8'))
          commits = {}
          for i in lock['inputs']:
              commits.setdefault(i['repo'], set()).add(i['commit'])
          for repo, cs in commits.items():
              if len(cs) != 1:
                  sys.exit(f'{repo} の commit が1つに定まりません: {sorted(cs)}')
          need = ['kken78/shiga-hino-plans', 'kken78/hino-ronten', 'kken78/hino-town-docs']
          missing = [r for r in need if r not in commits]
          if missing:
              sys.exit(f'inputs.lock.json に無いリポジトリ: {missing}')
          print('plans=' + commits['kken78/shiga-hino-plans'].pop())
          print('ronten=' + commits['kken78/hino-ronten'].pop())
          print('towndocs=' + commits['kken78/hino-town-docs'].pop())
          PY

      - uses: actions/checkout@v7
        with:
          repository: kken78/shiga-hino-plans
          ref: ${{ steps.lock.outputs.plans }}
          path: shiga-hino-plans

      - uses: actions/checkout@v7
        with:
          repository: kken78/hino-ronten
          ref: ${{ steps.lock.outputs.ronten }}
          path: hino-ronten

      - uses: actions/checkout@v7
        with:
          repository: kken78/hino-town-docs
          ref: ${{ steps.lock.outputs.towndocs }}
          path: hino-town-docs

      - name: lock の材料のファイルがそろっているか
        run: |
          python3 - <<'PY'
          import json, os, sys
          lock = json.load(open('hino-zaisei/inputs.lock.json', encoding='utf-8'))
          miss = [f"{i['repo']} {i['path']}" for i in lock['inputs']
                  if not os.path.isfile(os.path.join(i['repo'].split('/')[1], i['path']))]
          if miss:
              sys.exit('lock の commit に無いファイル: ' + ', '.join(miss))
          print(f"lock の {len(lock['inputs'])}ファイルがそろっている")
          PY

      - name: 材料の検算と data.js の作り直し(build_data.py)
        working-directory: hino-zaisei
        run: python3 tools/build_data.py --src "$GITHUB_WORKSPACE"

      - name: data.js がコミットされたものと一致するか
        working-directory: hino-zaisei
        run: |
          if ! git diff --exit-code --stat -- data.js; then
            echo "::error::data.js が材料から作り直した結果と一致しません。python3 tools/build_data.py を実行してコミットしてください。"
            exit 1
          fi

      # 共通の部品（見出し・分野のナビ・ページの一覧・フッター）は hino-portal の shared/ の写し（DESIGN.md ADR-1）
      # 文字の大きさは hino-portal DESIGN.md 5.2（DESIGN.md ADR-3）
      - name: 共通の部品と文字の大きさ（hino-portal の shared/check.py）
        working-directory: hino-zaisei
        run: |
          git clone --depth 1 https://github.com/kken78/hino-portal.git /tmp/hino-portal
          python3 /tmp/hino-portal/shared/check.py --fonts index.html

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: 実ブラウザでの文字の大きさと横のはみ出し（hino-portal の shared/check_mobile.mjs）
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          cd "$GITHUB_WORKSPACE/hino-zaisei"
          PLAYWRIGHT_MODULE=/tmp/pw/node_modules/playwright/index.mjs node /tmp/hino-portal/shared/check_mobile.mjs index.html
